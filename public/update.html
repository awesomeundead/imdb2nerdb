<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>imdb2nerdb · atualizar filme</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav><a href="/movies">Filmes</a><a href="/cast">Elenco</a><a href="/update">Atualizar</a></nav>
  <h1>Atualizar filme (PATCH)</h1>
  <textarea id="json" placeholder='{"problem":"no_title","items":[{"id":1614,"imdb":"tt3450650"}]}'></textarea>
  <p>
    <label><input type="checkbox" id="dry"> Só simular (não envia para a API)</label>
    <button id="run">Processar</button>
  </p>
  <pre id="log"></pre>

  <script src="/app.js"></script>
  <script>
    setupBatchPage({
      endpoint: '/run-update',
      formatOk: r => `✔ #${r.id} atualizado com sucesso`,
      formatError: r => `✖ ${r.id ? `#${r.id}: ` : ''}${r.error}`
    });
  </script>
</body>
</html>
