<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>imdb2nerdb · elenco</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav><a href="/movies">Filmes</a><a href="/cast">Elenco</a><a href="/update">Atualizar</a></nav>
  <h1>Enviar elenco</h1>
  <textarea id="json" placeholder='{"items":[{"id":203,"imdb":"tt0084787"}]}'></textarea>
  <p>
    <label><input type="checkbox" id="dry"> Só simular (não envia para a API)</label>
    <button id="run">Processar</button>
  </p>
  <pre id="log"></pre>

  <script src="/app.js"></script>
  <script>
    setupBatchPage({
      endpoint: '/run',
      formatOk: r => `✔ #${r.id} (${r.imdb}) — ${r.count} atores${r.fromCache ? ' (cache)' : ''}`,
      formatError: r => `✖ ${r.id ? `#${r.id} (${r.imdb}) — ` : ''}${r.error}`
    });
  </script>
</body>
</html>
