<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>imdb2nerdb · filmes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav><a href="/movies">Filmes</a><a href="/cast">Elenco</a><a href="/update">Atualizar</a></nav>
  <h1>Enviar filmes</h1>
  <textarea id="json" placeholder='{"items":[{"imdb":"tt0084787"}]}'></textarea>
  <p>
    <label><input type="checkbox" id="dry"> Só simular (não envia para a API)</label>
    <button id="run">Processar</button>
  </p>
  <pre id="log"></pre>

  <script src="/app.js"></script>
  <script>
    setupBatchPage({
      endpoint: '/run-movies',
      formatOk: r => `✔ (${r.imdb}) — ${r.title} (${r.release_year}) [${(r.genres || []).join(', ')}]${r.fromCache ? ' (cache)' : ''}`,
      formatError: r => `✖ ${r.imdb ? `(${r.imdb}) — ` : ''}${r.error}`
    });
  </script>
</body>
</html>
